name: Update Contributors

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  contrib-readme-job:
    runs-on: ubuntu-latest
    name: Update README with contributors
    steps:
      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@v2.3.10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
