apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meshbeacon.fullname" . }}-mosquitto
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest file /mosquitto/log/mosquitto.log
    listener 1883 0.0.0.0
    allow_anonymous true
