# podAffinity pins this onto the same node as the app Deployment, since
# they share the same ReadWriteOnce app-database/app-storage PVCs (most CSI
# drivers only allow an RWO volume to be attached on one node at a time).
# Set highAvailability: true (after switching to RWX storage) to drop this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meshbeacon.fullname" . }}-mqtt-worker
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mqttWorker.replicas }}
  selector:
    matchLabels:
      {{- include "meshbeacon.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "mqtt-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meshbeacon.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "mqtt-worker") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: {{ .Values.wwwDataGid }}
      {{- if not .Values.highAvailability }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "meshbeacon.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "app") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: mqtt-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/var/www/services/docker/worker-entrypoint.sh", "mqtt", "php", "artisan", "app:mqtt-subscribe"]
          envFrom:
            - configMapRef:
                name: {{ include "meshbeacon.fullname" . }}-config
            - secretRef:
                name: {{ include "meshbeacon.secretName" . }}
          volumeMounts:
            - name: app-database
              mountPath: /var/www/database
            - name: app-storage
              mountPath: /var/www/storage
          readinessProbe:
            exec:
              command: ["php", "artisan", "observability:check", "worker", "--worker=mqtt"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            exec:
              command: ["php", "artisan", "observability:check", "worker", "--worker=mqtt"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
      volumes:
        - name: app-database
          persistentVolumeClaim:
            claimName: {{ include "meshbeacon.fullname" . }}-database
        - name: app-storage
          persistentVolumeClaim:
            claimName: {{ include "meshbeacon.fullname" . }}-storage
