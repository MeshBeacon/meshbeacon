# Same vhost as services/nginx/default.conf, except fastcgi_pass targets
# 127.0.0.1:9000 - nginx runs as a sidecar container in the same Pod as
# php-fpm (sharing one network namespace + an emptyDir for
# /var/www/public), not as a separate Service like in docker-compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meshbeacon.fullname" . }}-nginx
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /var/www/public;

        client_max_body_size 500M;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.pbf$ {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/tiles.php;
            fastcgi_param TILE_Z $1;
            fastcgi_param TILE_X $2;
            fastcgi_param TILE_Y $3;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
  javascript-mime.conf: |
    types {
        application/javascript js mjs;
    }
