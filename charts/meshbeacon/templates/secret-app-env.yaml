{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meshbeacon.secretName" . }}
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ .Values.secrets.appKey | quote }}
  {{- if ne .Values.database.connection "sqlite" }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  {{- end }}
  MESHBEACON_ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  MESHBEACON_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  TELEGRAM_BOT_USERNAME: {{ .Values.secrets.telegramBotUsername | quote }}
  TELEGRAM_WEBHOOK_SECRET: {{ .Values.secrets.telegramWebhookSecret | quote }}
  DUCK_CRYPTO_PRIVATE_KEY: {{ .Values.secrets.duckCryptoPrivateKey | quote }}
  DUCK_CRYPTO_PUBLIC_KEY: {{ .Values.secrets.duckCryptoPublicKey | quote }}
  DUCK_MESH_GROUP_KEY: {{ .Values.secrets.duckMeshGroupKey | quote }}
  OPENTAK_BRIDGE_PRIVATE_KEY: {{ .Values.secrets.opentakBridgePrivateKey | quote }}
  OPENTAK_BRIDGE_PUBLIC_KEY: {{ .Values.secrets.opentakBridgePublicKey | quote }}
  OPENTAK_SERVER_PUBLIC_KEY: {{ .Values.secrets.opentakServerPublicKey | quote }}
{{- end }}
