apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meshbeacon.fullname" . }}-database
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.storage.accessMode | quote }}]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.database.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meshbeacon.fullname" . }}-storage
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.storage.accessMode | quote }}]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.app.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meshbeacon.fullname" . }}-mqtt-data
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.mqttData.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meshbeacon.fullname" . }}-mqtt-log
  labels:
    {{- include "meshbeacon.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.mqttLog.size }}
