x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.compose
  image: ${MESHBEACON_IMAGE:-meshbeacon:local}
  env_file:
    - .env
  volumes:
    - app-database:/var/www/database
    - app-storage:/var/www/storage
    - public-assets:/var/www/public

services:
  migrate:
    <<: *app-common
    user: "0:0"
    restart: "no"
    command: >
      sh -ec "php artisan migrate --no-interaction --force &&
      php artisan db:seed --no-interaction --force"

  permissions:
    <<: *app-common
    user: "0:0"
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -ec "chown -R www-data:www-data /var/www/database /var/www/storage &&
      chmod -R ug+rwX /var/www/database /var/www/storage &&
      chmod -R a+rX /var/www/public"

  app:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${MESHBEACON_PORT:-8080}:80"
    volumes:
      - public-assets:/var/www/public:ro
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mqtt-worker:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      - app
    command: php artisan app:mqtt-subscribe

  queue-worker:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      - app
    command: php artisan queue:work --queue=sync,default --tries=5 --timeout=0

  scheduler:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      - app
    command: >
      /bin/sh -ec "while true; do
      php artisan schedule:run --no-interaction;
      sleep 60;
      done"

  mqtt-server:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_BIND_PORT:-1883}:1883"
    volumes:
      - ./services/mosquitto/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

volumes:
  app-database:
  app-storage:
  public-assets:
  mqtt-data:
  mqtt-log:
