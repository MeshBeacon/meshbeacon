services:
  migrate:
    image: docker.io/muhammadn/opendms:1.0.2
    env_file: .env
    user: "0:0"
    volumes:
      - .env:/var/www/.env
      - ./database:/var/www/database
    command: php artisan migrate --no-interaction --force

  permissions:
    image: docker.io/muhammadn/opendms:1.0.2
    user: "0:0"
    depends_on:
      - migrate
    volumes:
      - .env:/var/www/.env
      - ./database:/var/www/database
    entrypoint: >
      sh -c "chmod 666 /var/www/database/database.sqlite && 
      chown www-data:www-data /var/www/database/database.sqlite"

  # Main HTTP Web App Service
  app:
    image: docker.io/muhammadn/opendms:1.0.2
    restart: always
    env_file: .env
    depends_on: 
      - permissions
    volumes:
      - .env:/var/www/.env
      - ./database:/var/www/database

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Dedicated Background Queue Worker
  mqtt-worker:
    image: docker.io/muhammadn/opendms:1.0.2
    depends_on:
      - app
    restart: always
    env_file: .env
    volumes:
      - .env:/var/www/.env
      - ./database:/var/www/database
    # Executes background jobs explicitly
    command: php artisan app:mqtt-subscribe

  # Dedicated Queue Worker
  queue-worker:
    image: docker.io/muhammadn/opendms:1.0.2
    depends_on:
      - app
    restart: always
    env_file: .env
    user: "0:0"
    volumes:
      - .env:/var/www/.env
      - ./database:/var/www/database
    command: php artisan queue:work --tries=5 --timeout=0

  # Dedicated Task Scheduler
  scheduler:
    image: docker.io/muhammadn/opendms:1.0.2
    depends_on:
      - app
    restart: always
    env_file: .env
    volumes:
      - .env:/var/www/.env
      - ./database:/var/www/database
    # Shell loop mimics cron to evaluate schedules every 60 seconds safely
    command: /bin/sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

  # Mosquitto MQTT server
  mqtt-server:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./services/mosquitto/config:/mosquitto/config
      - ./services/mosquitto/data:/mosquitto/data
      - ./services/mosquitto/log:/mosquitto/log
