x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile.compose
  image: ${MESHBEACON_IMAGE:-meshbeacon:local}
  env_file:
    - .env
  volumes:
    - app-database:/var/www/database
    - app-storage:/var/www/storage
    - public-assets:/var/www/public

services:
  migrate:
    <<: *app-common
    user: "0:0"
    restart: "no"
    command: >
      sh -ec "php artisan migrate --no-interaction --force &&
      php artisan db:seed --no-interaction --force &&
      php artisan observability:check migrations"
    healthcheck:
      test: ["CMD", "php", "artisan", "observability:check", "migrations"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  permissions:
    <<: *app-common
    user: "0:0"
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -ec "chown -R www-data:www-data /var/www/database /var/www/storage &&
      chmod -R ug+rwX /var/www/database /var/www/storage &&
      chmod -R a+rX /var/www/public"
    healthcheck:
      test: ["CMD-SHELL", "test -w /var/www/database && test -w /var/www/storage && test -r /var/www/public/index.php"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "observability:check", "app"]
      interval: ${MESHBEACON_HC_INTERVAL:-10s}
      timeout: 10s
      retries: 5
      start_period: 15s

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${MESHBEACON_PORT:-8080}:80"
    volumes:
      - public-assets:/var/www/public:ro
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt-worker:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      mqtt-server:
        condition: service_healthy
    command: ["/var/www/services/docker/worker-entrypoint.sh", "mqtt", "php", "artisan", "app:mqtt-subscribe"]
    healthcheck:
      test: ["CMD", "php", "artisan", "observability:check", "worker", "--worker=mqtt"]
      interval: ${MESHBEACON_WORKER_HC_INTERVAL:-15s}
      timeout: 10s
      retries: 4
      start_period: 20s

  queue-worker:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["/var/www/services/docker/worker-entrypoint.sh", "queue", "php", "artisan", "queue:work", "--queue=sync,default", "--tries=5", "--timeout=0"]
    healthcheck:
      test: ["CMD", "php", "artisan", "observability:check", "worker", "--worker=queue"]
      interval: ${MESHBEACON_WORKER_HC_INTERVAL:-15s}
      timeout: 10s
      retries: 4
      start_period: 20s

  scheduler:
    <<: *app-common
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["/var/www/services/docker/worker-entrypoint.sh", "scheduler", "/bin/sh", "-ec", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    healthcheck:
      test: ["CMD", "php", "artisan", "observability:check", "worker", "--worker=scheduler"]
      interval: ${MESHBEACON_WORKER_HC_INTERVAL:-15s}
      timeout: 10s
      retries: 4
      start_period: 20s

  mqtt-server:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_BIND_PORT:-1883}:1883"
    volumes:
      - ./services/mosquitto/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t '$$SYS/meshbeacon/healthcheck' -n -q 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app-database:
  app-storage:
  public-assets:
  mqtt-data:
  mqtt-log:
