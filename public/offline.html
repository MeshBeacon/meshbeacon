<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | MeshBeacon</title>
    <style>
        body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #111827; color: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .container { max-width: 28rem; padding: 2rem; border-radius: 0.5rem; background-color: #1f2937; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }

    <div class="container">
        <svg style="width: 3rem; height: 3rem; margin: 0 auto 1rem auto; color: #4b5563;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 14.25h3.375l2.625-5.25L13.125 18l3.75-9H21M3 3l18 18" />
