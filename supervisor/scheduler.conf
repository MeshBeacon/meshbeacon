[program:scheduler]
process_name=%(program_name)s_%(process_num)02d
command=/var/www/html/services/docker/worker-entrypoint.sh scheduler /bin/sh -ec "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
